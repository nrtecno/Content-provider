<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Video Player</title>

<!-- Telegram Web App SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- 1. MONETAG SDK -->
<script src='//libtl.com/sdk.js' data-zone='__MONETAG_ZONE__' data-sdk='show___MONETAG_ZONE__'></script>

<!-- 2. ADSGRAM SDK -->
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background-color: #09090b; color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; overflow: hidden;}
  
  .top-banner { background: linear-gradient(90deg, #4f46e5, #9333ea); padding: 12px 15px; margin: 15px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: white; }
  .banner-text { font-size: 13px; font-weight: 600; }
  .banner-text span { font-weight: 400; font-size: 11px; color: #e9d5ff; display: block; }
  .banner-btn { background: #fff; color: #4f46e5; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 12px; }
  
  .main-content { padding: 0 20px; display: flex; flex-direction: column; align-items: center; flex-grow: 1; justify-content: center; }
  
  .ticket-box { background: #1e1e1e; border: 1px dashed #444; border-radius: 12px; padding: 15px 30px; margin-bottom: 20px; text-align: center; width: 100%; max-width: 300px; }
  .ticket-box p { margin: 0 0 5px; font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px;}
  .ticket-box h3 { margin: 0; font-family: monospace; font-size: 20px; color: #2ea6ff; letter-spacing: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}

  #video-reveal-screen { display: none; flex-direction: column; align-items: center; width: 100%; animation: fadeIn 0.5s; }
  
  /* Real Thumbnail Box */
  .thumbnail-box { 
      width: 100%; max-width: 300px; aspect-ratio: 16/9; 
      background: #18181b; 
      border-radius: 16px; overflow: hidden; border: 2px solid #3f3f46; 
      margin-bottom: 20px; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .thumbnail-box img { width: 100%; height: 100%; object-fit: cover; }
  
  .play-redirect-btn { background: linear-gradient(90deg, #06b6d4, #3b82f6); color: #fff; border: none; padding: 16px; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; width: 100%; max-width: 300px; box-shadow: 0 5px 20px rgba(59, 130, 246, 0.4); }
  
  /* Player Buttons */
  .btn-group { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 300px; }
  
  .play-btn-main { 
      background: linear-gradient(90deg, #06b6d4, #3b82f6); color: #fff; border: none; 
      padding: 15px 20px; border-radius: 10px; font-weight: 700; font-size: 16px; 
      cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3); transition: 0.2s; position: relative;
  }
  .play-btn-main:active { transform: scale(0.98); }
  .play-btn-main:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-adsgram { background: linear-gradient(90deg, #8b5cf6, #d946ef); box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3); }

  /* BEST Badge Styling */
  .best-badge {
      background: #22c55e; color: #fff; font-size: 10px; padding: 3px 8px;
      border-radius: 20px; margin-left: 5px; font-weight: 800;
      box-shadow: 0 2px 5px rgba(34, 197, 94, 0.4); animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); box-shadow: 0 0 10px #22c55e; }
      100% { transform: scale(1); }
  }
  
  #status-overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.95); padding: 20px 30px; border-radius: 12px; color: #fff; font-size: 15px; display: none; z-index: 1000; text-align: center; border: 1px solid #333; width: 220px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);}
  
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div id="status-overlay">Loading Ad...<br><span style="font-size:11px;color:#aaa;">Please wait...</span></div>

<a href="__CHANNEL_LINK__" target="_blank" class="top-banner">
  <div class="banner-text">💎 __CHANNEL_NAME__<br><span>Join us for premium updates!</span></div>
  <div class="banner-btn">Join Now →</div>
</a>

<div class="main-content">
  <!-- Screen 1: Choose Player & Watch Ad -->
  <div id="initial-screen" style="text-align: center; width: 100%; display: flex; flex-direction: column; align-items: center;">
    <div class="ticket-box">
      <p>Video ID</p>
      <h3 id="display-id">LOADING...</h3>
    </div>
    <p style="color: #a1a1aa; font-size: 13px; margin-bottom: 20px;">Select a player & watch the ad to unlock your video</p>
    
    <div class="btn-group">
        <button id="btn-player1" class="play-btn-main">
            ▶ Player 1 (Monetag Ad) <span class="best-badge">🔥 BEST</span>
        </button>
        <button id="btn-player2" class="play-btn-main btn-adsgram">
            ▶ Player 2 (Adsgram Ad)
        </button>
    </div>
  </div>

  <!-- Screen 2: Unlocked Video (Real Thumbnail) -->
  <div id="video-reveal-screen">
    <div class="thumbnail-box"><img id="thumb-img" src="" alt="Thumbnail"></div>
    <button id="redirect-btn" class="play-redirect-btn">▶ Play Video on Bot</button>
    <p style="color: #71717a; font-size: 12px; margin-top: 15px; text-align: center;">You will be redirected to our Bot to receive the video securely.</p>
  </div>
</div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

  // Ab ID chhoti hai (jaise "25"), toh direct milegi
  let vidId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) ? tg.initDataUnsafe.start_param : new URLSearchParams(window.location.search).get('id');
  
  const displayId = document.getElementById('display-id');
  const btnPlayer1 = document.getElementById('btn-player1');
  const btnPlayer2 = document.getElementById('btn-player2');
  const initialScreen = document.getElementById('initial-screen');
  const revealScreen = document.getElementById('video-reveal-screen');
  const thumbImg = document.getElementById('thumb-img');
  const redirectBtn = document.getElementById('redirect-btn');
  const statusOverlay = document.getElementById('status-overlay');

  if (!vidId) { displayId.textContent = "ERROR"; btnPlayer1.disabled = true; btnPlayer2.disabled = true; return; }
  
  displayId.textContent = vidId;

  // Adsgram Initialize
  let AdController = null;
  try {
    if (window.Adsgram) {
      AdController = window.Adsgram.init({ blockId: "__ADSGRAM_BLOCK_ID__" });
    }
  } catch (e) { console.warn('Adsgram init failed', e); }

  // --- PLAYER 1: MONETAG AD ---
  btnPlayer1.addEventListener('click', function() {
    btnPlayer1.disabled = true;
    btnPlayer2.disabled = true;
    statusOverlay.style.display = 'block';
    statusOverlay.innerHTML = 'Loading Monetag Ad...';

    if (typeof window['show___MONETAG_ZONE__'] === 'function') {
        window['show___MONETAG_ZONE__']().then(() => {
            statusOverlay.style.display = 'none';
            showRevealScreen();
        }).catch(() => {
            statusOverlay.style.display = 'none';
            alert("❌ You must watch the full ad to unlock the video!");
            btnPlayer1.disabled = false;
            btnPlayer2.disabled = false;
        });
    } else {
        statusOverlay.style.display = 'none';
        alert("Monetag Ad Service unavailable. Try Player 2.");
        btnPlayer1.disabled = false;
        btnPlayer2.disabled = false;
    }
  });

  // --- PLAYER 2: ADSGRAM AD ---
  btnPlayer2.addEventListener('click', function() {
    if (!AdController) {
        alert("Adsgram is not initialized.");
        return;
    }

    btnPlayer1.disabled = true;
    btnPlayer2.disabled = true;
    statusOverlay.style.display = 'block';
    statusOverlay.innerHTML = 'Loading Adsgram Ad...';

    AdController.show().then(() => {
        statusOverlay.style.display = 'none';
        showRevealScreen();
    }).catch((err) => {
        statusOverlay.style.display = 'none';
        if(err && err.toString().includes("not active")) {
             alert("❌ Adsgram Block is not active yet. Please use Player 1.");
        } else {
             alert("❌ You must watch the full ad to unlock the video!");
        }
        btnPlayer1.disabled = false;
        btnPlayer2.disabled = false;
    });
  });

  function showRevealScreen() {
    initialScreen.style.display = 'none';
    revealScreen.style.display = 'flex';
    // Real Thumbnail Load Karein
    thumbImg.src = '/thumb/' + encodeURIComponent(vidId);
  }

  redirectBtn.addEventListener('click', function() {
    const botUsername = "__BOT_USERNAME__"; 
    const botLink = `https://t.me/${botUsername}?start=${vidId}`;
    if (tg) { tg.openTelegramLink(botLink); } else { window.open(botLink, '_blank'); }
  });
})();
</script>
</body>
</html>
